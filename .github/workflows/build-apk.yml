# 推送到 main 就自动编一个 release APK，编好挂在 Actions 产物里；
# 打 v* 标签推送时再自动发一个 Release，手机直接下 APK。
# 用 Flutter 3.0.0（和 pubspec 锁定的版本一致），Java 17。
name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.0'
          cache: true
      - run: flutter pub get
      # 固定发布签名：把 Secrets 里的密钥解出来写进 keystore.properties，
      # build.gradle 读到它就用这把密钥签 release 包；没配 Secrets 时
      # build.gradle 会回退到 debug 签名，不会编包失败。
      # Secrets 在仓库 Settings → Secrets and variables → Actions 里设：
      # ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      - name: 写入发布签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: suiyi-tingshu-apk
          path: build/app/outputs/flutter-apk/app-release.apk
