name: android-apk

# 手动触发或打 tag（v*）时构建 APK：
# - 每次都在 Actions 里产出 app-release.apk 工件（可下载安装）
# - 打 tag 时顺手上传成 Release 资源，手机直接点链接装
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 项目锁在 Flutter 3.0.0 / Dart 2.17（pubspec sdk <3.0.0），
      # 用新版本 Flutter 会直接 pub get 失败。
      - name: Flutter 3.0.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.0'
          channel: stable
          cache: true

      # AGP 7.1.2 不认识 compileSdk 33，会刷一条告警；这里抑制掉，不影响产物。
      - name: 抑制 compileSdk 33 告警
        run: echo "android.suppressUnsupportedCompileSdk=33" >> android/gradle.properties

      - name: pub get
        run: flutter pub get

      - name: build apk
        run: flutter build apk --release

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: ssyys-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 打 tag 时挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}